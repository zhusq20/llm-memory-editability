[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-memory-editability"
version = "0.1.0"
description = "Controlled experiments on shared representations and knowledge editability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
neural = ["torch>=2.5,<3"]
bios-original = ["torch==2.8.0", "tokenizers==0.22.2"]
analysis = ["matplotlib>=3.9,<4"]
tracking = ["wandb==0.30.0"]
archive = ["huggingface-hub>=0.30,<1"]

[project.scripts]
memory-editability = "llm_memory_editability.cli:main"
memory-editability-neural = "llm_memory_editability.neural:main"

[project.urls]
Repository = "https://github.com/zhusq20/llm-memory-editability"
Issues = "https://github.com/zhusq20/llm-memory-editability/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
# Frozen experiment sources retain their original content and audit hashes.
extend-exclude = ["docs/development-artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
